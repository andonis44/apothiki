<!doctype html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ΠΕΛΛΕΤ — Διαχείριση</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --paper:#E6E6E3;
  --surface:#FBFBFA;
  --surface-2:#EEEEEB;
  --ink:#242422;
  --ink-soft:#6C6C68;
  --pine:#45453F;
  --pine-deep:#242422;
  --rust:#A8431D;
  --rust-deep:#7E2F12;
  --birch:#8F8F87;
  --line:#D6D6D1;
  --line-soft:#E4E4E0;
  --shadow: 0 1px 0 rgba(36,36,34,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(36,36,34,0.05), transparent),
    var(--paper);
  color:var(--ink);
  font-family:'Work Sans',sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}

#app{max-width:1040px;margin:0 auto;padding:0 16px 64px;}

/* ---------- Header ---------- */
.hero{
  padding:28px 4px 18px;
  border-bottom:2px solid var(--ink);
  margin-bottom:18px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;
}
.hero-title{font-size:34px;font-weight:700;letter-spacing:-0.01em;margin:0;color:var(--ink);}
.hero-title .accent{color:var(--birch);}
.hero-sub{font-size:13px;color:var(--ink-soft);margin-top:4px;}
.hero-date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);text-align:right;}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.tab{
  font-family:'Work Sans',sans-serif;font-weight:600;font-size:13.5px;
  padding:10px 16px;background:none;border:none;cursor:pointer;color:var(--ink-soft);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;
  white-space:nowrap;
}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--pine-deep);border-bottom-color:var(--pine);}

.view{display:none;}
.view.active{display:block;animation:fade .2s ease;}
@keyframes fade{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

/* ---------- Cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:16px;box-shadow:var(--shadow);
}
.section-title{
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);
  font-weight:600;margin:0 0 12px;
}

/* ---------- Dashboard product cards ---------- */
.stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:20px;}
.stock-card{
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.stock-card .pname{font-family:'Fraunces',serif;font-weight:600;font-size:16px;margin:0 0 8px;}
.stock-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
.stock-row b{color:var(--ink);font-family:'IBM Plex Mono',monospace;font-weight:600;}
.gauge{
  height:8px;border-radius:4px;background:var(--line-soft);margin:10px 0 6px;overflow:hidden;
  display:flex;
}
.gauge-fill{height:100%;background:var(--pine);transition:width .3s;}
.gauge-fill.low{background:var(--rust);}
.stock-neg{color:var(--rust-deep);font-weight:600;}
.cell-strong{font-weight:700;font-size:13.5px;color:var(--ink);}
.balance-pill{display:inline-block;font-weight:700;background:#F2DED4;color:var(--rust-deep);padding:3px 10px;border-radius:20px;font-size:12.5px;}
.pellet-dots{position:absolute;top:12px;right:12px;font-size:10px;color:var(--birch);opacity:.5;letter-spacing:2px;}

/* ---------- Summary strip ---------- */
.summary-strip{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px;}
.summary-item{flex:1;min-width:140px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;}
.summary-item .label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;}
.summary-item .value{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;margin-top:3px;}
.summary-item .value.rust{color:var(--rust-deep);}
.summary-item .value.pine{color:var(--pine-deep);}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-soft);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--ink);
}
tbody td{padding:8px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
tbody tr:hover{background:var(--surface-2);}
.num{font-family:'IBM Plex Mono',monospace;text-align:right;}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;}

/* ---------- Badges ---------- */
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;}
.badge.pending{background:#E3E3DE;color:#4A4A46;}
.badge.partial{background:#D9D9D4;color:var(--pine-deep);}
.badge.delivered{background:#DCDCD8;color:var(--pine-deep);}
.badge.cancelled{background:#EFD9D2;color:var(--rust-deep);}
.badge.none{background:var(--line-soft);color:var(--ink-soft);}

/* ---------- Buttons ---------- */
button{font-family:'Work Sans',sans-serif;cursor:pointer;}
.btn{
  background:var(--pine);color:#fff;border:none;border-radius:5px;padding:9px 16px;
  font-weight:600;font-size:13px;transition:background .15s;
}
.btn:hover{background:var(--pine-deep);}
.btn.secondary{background:none;border:1px solid var(--ink);color:var(--ink);}
.btn.secondary:hover{background:var(--surface-2);}
.btn.danger{background:none;border:1px solid var(--rust);color:var(--rust-deep);}
.btn.danger:hover{background:#F5E5DE;}
.btn.small{padding:5px 10px;font-size:12px;border-radius:4px;}
.icon-btn{background:none;border:none;color:var(--ink-soft);font-size:15px;padding:3px 6px;border-radius:4px;}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.toolbar .filters{display:flex;gap:8px;flex-wrap:wrap;}

select,input,textarea{
  font-family:'Work Sans',sans-serif;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);
  border-radius:5px;background:var(--surface);color:var(--ink);width:100%;
}
select:focus,input:focus,textarea:focus{outline:2px solid var(--birch);outline-offset:1px;}
label{font-size:11.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px;}
.field{margin-bottom:12px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(42,33,24,.45);display:none;align-items:flex-start;justify-content:center;
  z-index:50;padding:40px 16px;overflow-y:auto;
}
.modal-backdrop.open{display:flex;}
.modal{
  background:var(--surface);border-radius:8px;padding:22px;max-width:480px;width:100%;
  box-shadow:0 12px 40px rgba(0,0,0,.25);
}
.modal h3{margin:0 0 16px;font-size:18px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

/* ---------- Empty state ---------- */
.empty{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

/* ---------- Delivery slip ---------- */
.slip-wrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;}
.slip-picker{flex:0 0 260px;}
.slip{
  flex:1;min-width:280px;background:#fff;border:1px solid var(--line);border-radius:6px;
  padding:28px;box-shadow:0 2px 10px rgba(0,0,0,.06);
}
.slip h2{margin:0 0 2px;font-size:22px;}
.slip .slip-sub{color:var(--ink-soft);font-size:12px;margin-bottom:18px;}
.slip-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px;}
.slip-row .k{color:var(--ink-soft);}
.slip-row .v{font-weight:600;font-family:'IBM Plex Mono',monospace;}
.slip-total{margin-top:12px;padding-top:12px;border-top:2px solid var(--ink);display:flex;justify-content:space-between;font-size:17px;font-weight:700;}
.slip-thanks{margin-top:20px;text-align:center;font-family:'Fraunces',serif;font-style:italic;color:var(--ink-soft);font-size:13.5px;}

@media print{
  body *{visibility:hidden;}
  .slip,.slip *{visibility:visible;}
  .slip{position:absolute;top:0;left:0;width:100%;box-shadow:none;border:none;}
}

.status-toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--surface);padding:9px 18px;border-radius:20px;
  font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:100;
}
.status-toast.show{opacity:1;}

.link-btn{background:none;border:none;color:var(--pine-deep);font-weight:600;font-size:12.5px;text-decoration:underline;padding:0;}

@media (max-width:640px){
  .field-row{grid-template-columns:1fr;}
  .hero{flex-direction:column;align-items:flex-start;}
}
</style>
</head>

/* ============================= STORAGE (Google Apps Script / Google Sheet) ============================= */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx40hSHzftQIM-LeKsuhcQepDLC82bg8qgHPb7eQzskK8ScNE1zqLLy2fiIAEK80Pk3/exec';

function jsonpLoad(){
  return new Promise((resolve)=>{
    const cbName = 'pelletCb_' + Date.now();
    let done = false;
    const script = document.createElement('script');
    window[cbName] = function(res){
      if(done) return;
      done = true;
      delete window[cbName];
      script.remove();
      resolve(res);
    };
    script.src = APPS_SCRIPT_URL + '?action=load&callback=' + cbName;
    script.onerror = ()=>{ if(done) return; done = true; delete window[cbName]; script.remove(); resolve({success:false}); };
    document.body.appendChild(script);
    setTimeout(()=>{
      if(done) return; done = true;
      delete window[cbName]; script.remove(); resolve({success:false});
    }, 10000);
  });
}

function iframePost(dataStr){
  return new Promise((resolve)=>{
    const iframeName = 'pelletPostFrame_' + Date.now();
    const iframe = document.createElement('iframe');
    iframe.name = iframeName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = APPS_SCRIPT_URL;
    form.target = iframeName;
    form.style.display = 'none';

    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'data';
    input.value = dataStr;
    form.appendChild(input);

    document.body.appendChild(form);
    form.submit();

    setTimeout(()=>{
      form.remove();
      iframe.remove();
      resolve(true);
    }, 1500);
  });
}

async function loadData(){
  const res = await jsonpLoad();
  if(res && res.success && res.data && res.data !== '{}'){
    try{
      const parsed = JSON.parse(res.data);
      DATA = (parsed && parsed.products) ? parsed : seedData();
    }catch(e){
      DATA = seedData();
    }
  } else {
    DATA = seedData();
  }
  document.getElementById('loadingMsg').style.display = 'none';
  renderAll();
  if(!res || !res.success || !res.data || res.data === '{}'){
    await saveData(); // persist the seed on first run so the sheet isn't empty
  }
}
async function saveData(){
  await iframePost(JSON.stringify(DATA));
}

function showToast(msg){

/* ============================= HELPERS ============================= */
function eur(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return n.toLocaleString('el-GR',{minimumFractionDigits:0,maximumFractionDigits:2}) + ' €';
}
function num(n,d=0){ if(n===null||n===undefined||isNaN(n)) return '—'; return Number(n).toLocaleString('el-GR',{maximumFractionDigits:d}); }
function customerName(id){ return DATA.customers.find(c=>c.id===id)?.name || '—'; }
function productName(id){ return DATA.products.find(p=>p.id===id)?.name || '—'; }
function productById(id){ return DATA.products.find(p=>p.id===id); }

function toPallets(order){
  const p = productById(order.productId);
  if(!p) return 0;
  if(order.unit === 'Παλέτα') return Number(order.quantity)||0;
  const bpp = Number(p.bagsPerPallet)||0;
  if(!bpp) return 0;
  return (Number(order.quantity)||0) / bpp;
}
function orderTotal(order){
  return (Number(order.quantity)||0) * (Number(order.unitPrice)||0);
}
function orderBalance(order){
  return orderTotal(order) - (Number(order.paidAmount)||0);
}
function badgeClass(status){
  switch(status){
    case 'Εκκρεμεί': return 'pending';
    case 'Μερική Παράδοση': return 'partial';
    case 'Παραδόθηκε': return 'delivered';
    case 'Ακυρώθηκε': return 'cancelled';
    default: return 'none';
  }
}

function productStats(productId){
  const p = productById(productId);
  const orders = DATA.orders.filter(o=>o.productId===productId);
  let ordered = 0, delivered = 0, unpaid = 0;
  orders.forEach(o=>{
    ordered += toPallets(o);
    if(o.deliveryStatus === 'Παραδόθηκε' || o.deliveryStatus === 'Μερική Παράδοση'){
      const p2 = productById(o.productId);
      if(o.unit === 'Παλέτα'){ delivered += Number(o.deliveredQty)||0; }
      else if(p2 && p2.bagsPerPallet){ delivered += (Number(o.deliveredQty)||0)/p2.bagsPerPallet; }
    }
    if(o.deliveryStatus !== 'Ακυρώθηκε' && o.deliveryStatus !== 'Παραδόθηκε'){
      unpaid += orderBalance(o);
    }
  });
  const available = (Number(p.initialStock)||0) - ordered;
  const toDeliver = ordered - delivered;
  const value = available * (Number(p.palletPrice)||0);
  return {ordered, delivered, toDeliver, available, unpaid, value};
}

function isOrderCompleted(o){

  if(o.deliveryStatus === 'Παραδόθηκε' && orderBalance(o) <= 0) return true;
  return false;
}
function matchesSearch(o, q){
  if(!q) return true;
  q = q.toLowerCase();
  return customerName(o.customerId).toLowerCase().includes(q) || productName(o.productId).toLowerCase().includes(q);
}

function autoFillPrice(){
  const pid = document.getElementById('f-product').value;
  const unit = document.getElementById('f-unit').value;
  const p = productById(pid);
  const priceEl = document.getElementById('f-uprice');
  if(p && !priceEl.value){
    priceEl.value = unit==='Παλέτα' ? (p.palletPrice||'') : (p.bagPrice||'');
  }
}
document.addEventListener('change', (e)=>{
  if(e.target && e.target.id==='f-unit') autoFillPrice();
});
function computeAutoStatus(quantity, deliveredQty, cancelled){
  if(cancelled) return 'Ακυρώθηκε';
  if(!deliveredQty || deliveredQty<=0) return 'Εκκρεμεί';
  if(deliveredQty >= quantity) return 'Παραδόθηκε';
  return 'Μερική Παράδοση';
}
function updateStatusDisplay(){
  const qty = parseFloat(document.getElementById('f-qty').value)||0;
  const delQty = parseFloat(document.getElementById('f-delqty').value)||0;
  const cancelled = document.getElementById('f-cancelled').checked;
  const status = computeAutoStatus(qty, delQty, cancelled);
  const disp = document.getElementById('status-display');
  disp.textContent = status;
  disp.className = 'badge ' + badgeClass(status);
}
async function saveOrder(id){
  const customerId = document.getElementById('f-customer').value;
  const productId = document.getElementById('f-product').value;
  const quantity = parseFloat(document.getElementById('f-qty').value)||0;
  const unit = document.getElementById('f-unit').value;
  const unitPrice = parseFloat(document.getElementById('f-uprice').value)||0;
  const paymentMethod = document.getElementById('f-pay').value;
  const paidAmount = parseFloat(document.getElementById('f-paid').value)||0;
  const deliveredQty = parseFloat(document.getElementById('f-delqty').value)||0;
  const cancelled = document.getElementById('f-cancelled').checked;
  const deliveryStatus = computeAutoStatus(quantity, deliveredQty, cancelled);
  const deliveryDate = document.getElementById('f-deldate').value || null;
  const notes = document.getElementById('f-notes').value;
  const fields = {customerId, productId, quantity, unit, unitPrice, paymentMethod, paidAmount, deliveryStatus, deliveredQty, deliveryDate, notes};
  if(id){
    const o = DATA.orders.find(x=>x.id===id);
    Object.assign(o, fields);
  } else {
    DATA.orders.push({id:uid('o'), date:new Date().toISOString().slice(0,10), ...fields});
  }
  await saveData();
  closeModal();
  renderOrders(); renderCompleted(); renderDashboard();
  showToast('Αποθηκεύτηκε.');
}
async function deleteOrder(id){
  if(!confirm('Διαγραφή παραγγελίας;')) return;
  DATA.orders = DATA.orders.filter(o=>o.id!==id);
  await saveData();
  renderOrders(); renderCompleted(); renderDashboard();
}

/* ---- Quick payment ---- */
function openPaymentModal(id){
  const o = DATA.orders.find(x=>x.id===id);
  if(!o) return;
  const balance = orderBalance(o);
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <h3>Καταχώρηση πληρωμής</h3>
    <div class="field"><label>Πελάτης</label><div class="cell-strong" style="font-size:15px;">${customerName(o.customerId)} — ${productName(o.productId)}</div></div>
    <div class="field"><label>Τρέχον υπόλοιπο</label><div class="cell-strong" style="font-size:16px;color:var(--rust-deep);">${eur(balance)}</div></div>
    <div class="field"><label>Ποσό πληρωμής (€)</label><input id="f-payAmount" type="number" step="0.01" value="${round2(balance)}"></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Άκυρο</button>
      <button class="btn" onclick="confirmPayment('${o.id}')">Καταχώρηση</button>
    </div>
  `;
  document.getElementById('modalBackdrop').classList.add('open');
}
async function confirmPayment(id){
  const o = DATA.orders.find(x=>x.id===id);
  if(!o) return;
  const amount = parseFloat(document.getElementById('f-payAmount').value)||0;
  if(amount<=0){ showToast('Βάλε ποσό μεγαλύτερο από 0.'); return; }
  o.paidAmount = (Number(o.paidAmount)||0) + amount;
  await saveData();
  closeModal();
  renderOrders(); renderCompleted(); renderDashboard();
  showToast('Η πληρωμή καταχωρήθηκε.');
}

/* ============================= DELIVERY SLIP ============================= */
function renderSlip(selectedId){
  const el = document.getElementById('view-slip');
  const options = DATA.orders.map(o=>`<option value="${o.id}" ${selectedId===o.id?'selected':''}>${customerName(o.customerId)} — ${productName(o.productId)} (${num(o.quantity)} ${o.unit})</option>`).join('');
  const o = selectedId ? DATA.orders.find(x=>x.id===selectedId) : DATA.orders[0];
  el.innerHTML = `
    <div class="slip-wrap">
      <div class="slip-picker card">
        <p class="section-title">Επιλογή παραγγελίας</p>
        <div class="field"><select id="slip-select" onchange="renderSlip(this.value)">${options}</select></div>
        <button class="btn" style="width:100%;margin-top:6px;" onclick="window.print()">🖨 Εκτύπωση δελτίου</button>
      </div>
      ${o ? slipHTML(o) : '<div class="empty">Δεν υπάρχουν παραγγελίες.</div>'}
    </div>
  `;
}
function slipHTML(o){
  const total = orderTotal(o);
  const balance = orderBalance(o);
  const c = DATA.customers.find(x=>x.id===o.customerId);
  return `
    <div class="slip">
      <h2>Δελτίο Αποστολής</h2>
      <div class="slip-sub">ΠΕΛΛΕΤ &middot; ${new Date().toLocaleDateString('el-GR')}</div>
      <div class="slip-row"><span class="k">Πελάτης</span><span class="v">${c?c.name:'—'}</span></div>
      ${c&&c.address? `<div class="slip-row"><span class="k">Διεύθυνση</span><span class="v" style="font-family:'Work Sans';font-weight:500;">${c.address}</span></div>`:''}
      ${c&&c.phone? `<div class="slip-row"><span class="k">Τηλέφωνο</span><span class="v">${c.phone}</span></div>`:''}
      <div class="slip-row"><span class="k">Είδος</span><span class="v" style="font-family:'Work Sans';font-weight:600;">${productName(o.productId)}</span></div>
      <div class="slip-row"><span class="k">Ποσότητα</span><span class="v">${num(o.quantity)} ${o.unit}</span></div>
      <div class="slip-row"><span class="k">Τιμή μονάδας</span><span class="v">${eur(o.unitPrice)}</span></div>
      <div class="slip-row"><span class="k">Τρόπος πληρωμής</span><span class="v" style="font-family:'Work Sans';font-weight:500;">${o.paymentMethod}</span></div>
      <div class="slip-row"><span class="k">Πληρώθηκε</span><span class="v">${eur(o.paidAmount)}</span></div>
      <div class="slip-row"><span class="k">Υπόλοιπο</span><span class="v">${eur(balance)}</span></div>
      <div class="slip-total"><span>Σύνολο</span><span>${eur(total)}</span></div>
      <div class="slip-thanks">Ευχαριστούμε για την προτίμηση!</div>
    </div>
  `;
}

/* ============================= EXCEL BACKUP EXPORT ============================= */
function exportToExcel(){
  if(typeof XLSX === 'undefined'){ showToast('Η βιβλιοθήκη Excel δεν φόρτωσε ακόμα — δοκίμασε ξανά σε λίγο.'); return; }
  const wb = XLSX.utils.book_new();

  // --- Σύνοψη ---
  const summaryRows = [['Είδος','Διαθέσιμο Απόθεμα (Παλέτες)','Τιμή Παλέτας (€)','Αξία Αποθέματος (€)','Προς Παράδοση (Παλέτες)','Ανεξόφλητα Ποσά (€)']];
  DATA.products.forEach(p=>{
    const s = productStats(p.id);
    summaryRows.push([p.name, round2(s.available), p.palletPrice||'', round2(s.value), round2(s.toDeliver), round2(s.unpaid)]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), 'Σύνοψη');

  // --- Αποθήκη Πελλετ ---
  const whRows = [['Είδος','Αρχικό Απόθεμα (Παλέτες)','Σακιά ανά Παλέτα','Παραγγελθέντα (Παλέτες)','Διαθέσιμο Απόθεμα (Παλέτες)','Παραδομένα (Παλέτες)','Προς Παράδοση (Παλέτες)','Τιμή Παλέτας (€)','Τιμή Σακιού (€)']];
  DATA.products.forEach(p=>{
    const s = productStats(p.id);
    whRows.push([p.name, p.initialStock, p.bagsPerPallet||'', round2(s.ordered), round2(s.available), round2(s.delivered), round2(s.toDeliver), p.palletPrice||'', p.bagPrice||'']);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(whRows), 'Αποθήκη Πελλετ');

  // --- Πελάτες ---
  const custRows = [['ID','Όνομα','Τηλέφωνο','Διεύθυνση','Σύνδεσμος Google Maps']];
  DATA.customers.forEach(c=> custRows.push([c.id, c.name, c.phone||'', c.address||'', c.mapsLink||'']));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(custRows), 'Πελάτες');

  // --- Παραγγελίες (active) & Ολοκληρωμένες ---
  const orderHeader = ['Α/Α','Ημερομηνία Παραγγελίας','Πελάτης','Είδος','Ποσότητα','Μονάδα','Τιμή Μονάδας (€)','Σύνολο (€)','Τρόπος Πληρωμής','Ποσό που Πληρώθηκε (€)','Υπόλοιπο Πληρωμής (€)','Κατάσταση Παράδοσης','Παραδομένη Ποσότητα','Ημ/νία Παράδοσης','Σημειώσεις'];
  const toRow = (o,i)=>[i+1, o.date||'', customerName(o.customerId), productName(o.productId), o.quantity, o.unit, o.unitPrice, round2(orderTotal(o)), o.paymentMethod, o.paidAmount, round2(orderBalance(o)), o.deliveryStatus, o.deliveredQty||0, o.deliveryDate||'', o.notes||''];
  const active = DATA.orders.filter(o=> !isOrderCompleted(o));
  const done = DATA.orders.filter(o=> isOrderCompleted(o));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([orderHeader, ...active.map(toRow)]), 'Παραγγελίες');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([orderHeader, ...done.map(toRow)]), 'Ολοκληρωμένες Παραγγελίες');

  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `ΠΕΛΛΕΤ_backup_${stamp}.xlsx`);
  showToast('Το backup κατέβηκε.');
}
function round2(n){ return Math.round((Number(n)||0)*100)/100; }

function closeModal(){ document.getElementById('modalBackdrop').classList.remove('open'); }
document.getElementById('modalBackdrop').addEventListener('click', (e)=>{
  if(e.target.id==='modalBackdrop') closeModal();
});

loadData();
