<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Η Αποθήκη μας</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.20.0"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');


:root{
  --bg:#F2F0EB;
  --surface:#FFFFFF;
  --ink:#23241F;
  --steel:#55606B;
  --signal:#E8A33D;
  --danger:#C1443D;
  --ok:#3F7A5D;
  --line:#D9D3C6;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}
#app{max-width:920px;margin:0 auto;padding:18px 16px 80px;}

/* header — bin tag banner */
.banner{
  background:var(--ink);color:var(--bg);border-radius:6px;
  padding:16px 18px;margin-bottom:16px;position:relative;overflow:hidden;
}
.banner::before{
  content:"";position:absolute;top:0;bottom:0;left:0;width:10px;background:var(--signal);
}
.banner h1{
  font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:0.04em;font-size:26px;margin:0 0 2px 8px;
}
.banner p{
  margin:0 0 0 8px;font-family:'IBM Plex Mono',monospace;font-size:12px;
  letter-spacing:0.08em;color:#D9D3C6;text-transform:uppercase;
}

/* toolbar */
.toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
.searchrow{display:flex;gap:8px;}
.searchrow input{
  flex:1;padding:11px 12px;border:1.5px solid var(--line);border-radius:5px;
  font-family:'IBM Plex Sans';font-size:15px;background:var(--surface);
}
.searchrow input:focus{outline:2px solid var(--steel);outline-offset:1px;}
.iconbtn{
  border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);
  border-radius:5px;padding:0 14px;font-family:'IBM Plex Mono';font-size:13px;
  font-weight:600;cursor:pointer;white-space:nowrap;
}
.iconbtn:focus-visible{outline:2px solid var(--signal);outline-offset:2px;}
.iconbtn.ghost{background:var(--surface);color:var(--ink);}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
.chip{
  flex:none;padding:6px 12px;border-radius:20px;border:1.5px solid var(--line);
  background:var(--surface);font-family:'IBM Plex Mono';font-size:12px;font-weight:600;
  cursor:pointer;text-transform:uppercase;letter-spacing:0.03em;color:var(--steel);
}
.chip.active{background:var(--ink);border-color:var(--ink);color:var(--bg);}

.actionrow{display:flex;gap:8px;margin-bottom:16px;}
.actionrow .iconbtn{flex:1;padding:12px;text-align:center;}
.actionrow .iconbtn.signal{background:var(--signal);border-color:var(--signal);color:var(--ink);}

/* product grid — shelf tags */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.card{
  background:var(--surface);border-radius:6px;border:1px solid var(--line);
  padding:0;position:relative;overflow:hidden;display:flex;
}
.card .bar{width:8px;flex:none;}
.card .body{padding:12px 14px;flex:1;min-width:0;}
.card .code{
  font-family:'IBM Plex Mono';font-size:11px;color:var(--steel);letter-spacing:0.04em;
  text-transform:uppercase;
}
.card .name{
  font-family:'IBM Plex Sans';font-weight:600;font-size:16px;margin:2px 0 8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.card .row{display:flex;justify-content:space-between;align-items:flex-end;}
.card .qty{font-family:'Oswald';font-weight:700;font-size:26px;line-height:1;}
.card .qty span{font-family:'IBM Plex Mono';font-size:11px;font-weight:500;color:var(--steel);display:block;text-transform:uppercase;}
.card .price{font-family:'IBM Plex Mono';font-size:15px;font-weight:600;color:var(--ink);text-align:right;}
.card .price span{display:block;font-size:10px;color:var(--steel);text-transform:uppercase;font-weight:500;}
.card .cardbtns{display:flex;gap:6px;margin-top:10px;}
.card .cardbtns button{
  flex:1;border:1px solid var(--line);background:var(--bg);border-radius:4px;
  padding:6px;font-family:'IBM Plex Mono';font-size:11px;font-weight:600;cursor:pointer;
  text-transform:uppercase;color:var(--steel);
}

.empty{
  text-align:center;padding:60px 20px;color:var(--steel);font-family:'IBM Plex Sans';
}
.empty b{display:block;font-family:'Oswald';font-size:20px;color:var(--ink);margin-bottom:6px;text-transform:uppercase;}

/* modal */
.overlay{
  position:fixed;inset:0;background:rgba(35,36,31,0.55);display:flex;
  align-items:center;justify-content:center;padding:16px;z-index:50;
}
.modal{
  background:var(--surface);border-radius:8px;padding:20px;max-width:420px;width:100%;
  max-height:90vh;overflow-y:auto;
}
.modal h2{
  font-family:'Oswald';text-transform:uppercase;font-size:19px;margin:0 0 14px;
  border-bottom:2px solid var(--ink);padding-bottom:8px;
}
.field{margin-bottom:12px;}
.field label{
  display:block;font-family:'IBM Plex Mono';font-size:11px;text-transform:uppercase;
  color:var(--steel);margin-bottom:4px;letter-spacing:0.03em;
}
.field input{
  width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:5px;
  font-family:'IBM Plex Sans';font-size:15px;
}
.field input:focus{outline:2px solid var(--steel);outline-offset:1px;}
.modalbtns{display:flex;gap:8px;margin-top:16px;}
.modalbtns .iconbtn{flex:1;text-align:center;padding:11px;}
.modalbtns .danger{background:var(--danger);border-color:var(--danger);}

.catopt{
  padding:9px 10px;font-family:'IBM Plex Sans';font-size:14px;cursor:pointer;
  border-bottom:1px solid var(--bg);
}
.catopt:last-child{border-bottom:none;}
.catopt:active,.catopt:hover{background:var(--bg);}

.qrwrap{text-align:center;padding:10px 0;}
#qrcanvas-holder{display:inline-block;padding:10px;background:#fff;border:2px solid var(--ink);border-radius:4px;}
.qrmeta{font-family:'IBM Plex Mono';font-size:12px;margin-top:10px;color:var(--steel);}

#scanvideo{width:100%;border-radius:6px;background:#000;}
.scanhint{font-family:'IBM Plex Mono';font-size:12px;color:var(--steel);text-align:center;margin-top:8px;}
.scanresult{
  background:var(--bg);border:1.5px solid var(--ink);border-radius:6px;padding:12px;margin-top:10px;
}

.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:5px;
  font-family:'IBM Plex Mono';font-size:12px;z-index:100;
}
</style>
</head>
<body>

<div id="app"></div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbylLR_wSZkwPGRWiMi9N2ytrYC3LoCX4LpNPV1uy4OYD1ArgR46imRJNIHpXiF3TM0RoA/exec';
const hasCloudStorage = typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';

// Generic JSONP call — avoids CORS entirely, works from file:// pages too
function jsonpCall(params, timeoutMs){
  return new Promise((resolve, reject)=>{
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    let done = false;
    const script = document.createElement('script');
    const timer = setTimeout(()=>{
      if(done) return; done = true;
      cleanup(); reject(new Error('timeout'));
    }, timeoutMs || 8000);
    function cleanup(){
      clearTimeout(timer);
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function(data){
      if(done) return; done = true;
      cleanup(); resolve(data);
    };
    script.onerror = ()=>{
      if(done) return; done = true;
      cleanup(); reject(new Error('jsonp load error'));
    };
    const qs = Object.keys(params).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
    script.src = APPS_SCRIPT_URL + '?' + qs + '&callback=' + cbName;
    document.body.appendChild(script);
  });
}

function jsonpList(timeoutMs){ return jsonpCall({ action: 'list' }, timeoutMs); }

// Hidden-iframe form POST — avoids CORS entirely (plain form navigation, not fetch/XHR)
function iframePostFields(fields){
  return new Promise((resolve)=>{
    const frameName = 'post_frame_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    const iframe = document.createElement('iframe');
    iframe.name = frameName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = APPS_SCRIPT_URL;
    form.target = frameName;
    form.style.display = 'none';

    Object.keys(fields).forEach(k=>{
      const input = document.createElement('input');
      input.name = k;
      input.value = fields[k] == null ? '' : String(fields[k]);
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();

    // Cross-origin iframe content can't be read, so just give it time to land
    setTimeout(()=>{
      if(form.parentNode) form.parentNode.removeChild(form);
      if(iframe.parentNode) iframe.parentNode.removeChild(iframe);
      resolve();
    }, 1500);
  });
}

function normalizeProduct(p){
  return {
    id: String(p.id),
    code: p.code != null ? String(p.code) : '',
    name: p.name != null ? String(p.name) : '',
    category: p.category != null ? String(p.category) : '',
    qty: Number(p.qty) || 0,
    price: Number(p.price) || 0,
    lowStockAt: Number(p.lowStockAt) || 5
  };
}

// Fallback storage (only used when APPS_SCRIPT_URL isn't set) — whole-array blob
async function storageGet(key){
  if(hasCloudStorage){
    return await window.storage.get(key, true);
  }
  try{
    const v = localStorage.getItem(key);
    return v ? { key, value: v, shared:false } : null;
  }catch(e){
    return null;
  }
}

async function storageSet(key, value){
  if(hasCloudStorage){
    return await window.storage.set(key, value, true);
  }
  try{
    localStorage.setItem(key, value);
    return { key, value, shared:false };
  }catch(e){
    return null;
  }
}

async function saveProductsArrayFallback(){
  try{
    const result = await withTimeout(storageSet('products', JSON.stringify(products)), 8000);
    if(!result){
      showToast('⚠ Δεν αποθηκεύτηκε — δοκίμασε ξανά.');
      return false;
    }
    return true;
  }catch(e){
    showToast('⚠ Δεν αποθηκεύτηκε (πρόβλημα σύνδεσης) — δοκίμασε ξανά.');
    return false;
  }
}

// Save/delete a single product as its own row (Apps Script path) — no cell-size limit
async function persistUpsert(data, isEdit, oldId){
  if(APPS_SCRIPT_URL){
    try{
      await iframePostFields({
        action: 'upsert',
        id: data.id, code: data.code, name: data.name, category: data.category,
        qty: data.qty, price: data.price, lowStockAt: data.lowStockAt
      });
      const verify = await withTimeout(jsonpList(), 8000);
      const found = verify && Array.isArray(verify.products) && verify.products.find(x=>String(x.id)===String(data.id));
      if(found){
        products = isEdit ? products.map(x=>x.id===oldId?data:x) : [...products, data];
        return true;
      }
      return false;
    }catch(e){
      return false;
    }
  }
  const backup = products;
  products = isEdit ? products.map(x=>x.id===oldId?data:x) : [...products, data];
  const ok = await saveProductsArrayFallback();
  if(!ok){ products = backup; }
  return ok;
}

async function persistDelete(id){
  if(APPS_SCRIPT_URL){
    try{
      await iframePostFields({ action: 'delete', id: id });
      const verify = await withTimeout(jsonpList(), 8000);
      const stillThere = verify && Array.isArray(verify.products) && verify.products.some(x=>String(x.id)===String(id));
      if(!stillThere){
        products = products.filter(x=>x.id!==id);
        return true;
      }
      return false;
    }catch(e){
      return false;
    }
  }
  const backup = products;
  products = products.filter(x=>x.id!==id);
  const ok = await saveProductsArrayFallback();
  if(!ok){ products = backup; }
  return ok;
}

let products = [];
let filterCat = 'Όλα';
let searchTerm = '';

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

let loadFailed = false;

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(()=>reject(new Error('timeout')), ms))
  ]);
}

async function loadProducts(){
  loadFailed = false;
  try{
    if(APPS_SCRIPT_URL){
      const data = await withTimeout(jsonpList(), 8000);
      products = (data && Array.isArray(data.products)) ? data.products.map(normalizeProduct) : [];
    } else {
      const res = await withTimeout(storageGet('products'), 8000);
      products = res && res.value ? JSON.parse(res.value) : [];
    }
  }catch(e){
    // key not existing yet is normal (empty warehouse); anything else, flag it
    products = [];
    if(!String(e && e.message).toLowerCase().includes('not found')){
      loadFailed = true;
    }
  }
  render();
}

function showToast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

function categories(){
  const set = new Set(products.map(p=>p.category).filter(Boolean));
  return ['Όλα', ...Array.from(set).sort()];
}

function stockLevel(p){
  const low = p.lowStockAt ?? 5;
  if(p.qty <= 0) return 'danger';
  if(p.qty <= low) return 'signal';
  return 'ok';
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const app = document.getElementById('app');
  const cats = categories();
  const list = products.filter(p=>{
    const matchCat = filterCat==='Όλα' || p.category===filterCat;
    const term = searchTerm.trim().toLowerCase();
    const matchSearch = !term || (p.name||'').toLowerCase().includes(term) || (p.code||'').toLowerCase().includes(term);
    return matchCat && matchSearch;
  });

  app.innerHTML = `
    <div class="banner">
      <h1>Η Αποθήκη μας</h1>
      <p>Υλικά οικοδομών • Εργαλεία • ${products.length} καταχωρημένα προϊόντα ${APPS_SCRIPT_URL ? '• Συγχρονισμένα σε όλες τις συσκευές' : (hasCloudStorage ? '• Κοινόχρηστα δεδομένα' : '• Τοπική αποθήκευση σε αυτή τη συσκευή')}</p>
    </div>
    ${loadFailed ? `
      <div style="background:var(--danger);color:#fff;padding:10px 14px;border-radius:6px;margin-bottom:14px;font-family:'IBM Plex Sans';font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <span>⚠ Πρόβλημα φόρτωσης — αυτά που βλέπεις μπορεί να μην είναι τα τελευταία δεδομένα.</span>
        <button id="btnRetryLoad" style="flex:none;background:#fff;color:var(--danger);border:none;border-radius:4px;padding:6px 10px;font-weight:600;cursor:pointer;">Ξαναδοκίμασε</button>
      </div>
    ` : ''}

    <div class="toolbar">
      <div class="searchrow">
        <input id="searchInput" type="text" placeholder="Αναζήτηση όνομα ή κωδικός..." value="${esc(searchTerm)}"/>
      </div>
      <div class="chips">
        ${cats.map(c=>`<div class="chip ${c===filterCat?'active':''}" data-cat="${esc(c)}">${esc(c)}</div>`).join('')}
      </div>
    </div>

    <div class="actionrow">
      <button class="iconbtn signal" id="btnAdd">+ Νέο προϊόν</button>
      <button class="iconbtn ghost" id="btnScan" style="border-color:var(--ink)">⌗ Σάρωση QR</button>
    </div>

    ${list.length===0 ? `
      <div class="empty">
        <b>${products.length===0 ? 'Δεν υπάρχουν προϊόντα ακόμα' : 'Δεν βρέθηκαν αποτελέσματα'}</b>
        ${products.length===0 ? 'Πάτησε "+ Νέο προϊόν" για να προσθέσεις το πρώτο σου είδος.' : 'Δοκίμασε άλλο όρο αναζήτησης ή κατηγορία.'}
      </div>
    ` : `
      <div class="grid">
        ${list.map(p=>`
          <div class="card">
            <div class="bar" style="background:var(--${stockLevel(p)})"></div>
            <div class="body">
              <div class="code">${esc(p.code)}</div>
              <div class="name">${esc(p.name)}</div>
              <div class="row">
                <div class="qty">${p.qty}<span>Τεμάχια</span></div>
                <div class="price">${Number(p.price||0).toFixed(2)}€<span>Τιμή</span></div>
              </div>
              <div class="cardbtns">
                <button data-qr="${p.id}">QR</button>
                <button data-edit="${p.id}">Επεξεργασία</button>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    `}
  `;

  document.getElementById('searchInput').addEventListener('input', e=>{
    searchTerm = e.target.value; render();
    // keep focus after re-render
    const el = document.getElementById('searchInput');
    el.focus(); el.selectionStart = el.selectionEnd = el.value.length;
  });
  document.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{ filterCat = el.dataset.cat; render(); });
  });
  if(loadFailed){
    document.getElementById('btnRetryLoad').addEventListener('click', loadProducts);
  }
  document.getElementById('btnAdd').addEventListener('click', ()=>openEditModal(null));
  document.getElementById('btnScan').addEventListener('click', openScanModal);
  document.querySelectorAll('[data-qr]').forEach(el=>{
    el.addEventListener('click', ()=>openQrModal(el.dataset.qr));
  });
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.addEventListener('click', ()=>openEditModal(el.dataset.edit));
  });
}

function closeModal(){
  const ov = document.querySelector('.overlay');
  if(ov){
    if(codeReader){ try{ codeReader.reset(); }catch(e){} codeReader=null; }
    ov.remove();
  }
}

function openEditModal(id, prefillCode){
  const p = id ? products.find(x=>x.id===id) : null;
  const wrap = document.createElement('div');
  wrap.className='overlay';
  wrap.innerHTML = `
    <div class="modal">
      <h2>${p ? 'Επεξεργασία προϊόντος' : 'Νέο προϊόν'}</h2>
      <div class="field"><label>Κωδικός</label><input id="f_code" value="${p?esc(p.code):esc(prefillCode||'')}" placeholder="π.χ. TSM-25KG"/></div>
      <div class="field"><label>Όνομα</label><input id="f_name" value="${p?esc(p.name):''}" placeholder="π.χ. Τσιμέντο 25kg"/></div>
      <div class="field" style="position:relative">
        <label>Κατηγορία</label>
        <input id="f_cat" autocomplete="off" value="${p?esc(p.category):''}" placeholder="π.χ. Υλικά / Εργαλεία"/>
        <div id="catSuggest" style="display:none;position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1.5px solid var(--line);border-top:none;border-radius:0 0 5px 5px;max-height:160px;overflow-y:auto;z-index:5;"></div>
      </div>
      <div class="field"><label>Ποσότητα</label><input id="f_qty" type="number" value="${p?p.qty:0}"/></div>
      <div class="field"><label>Τιμή (€)</label><input id="f_price" type="number" step="0.01" value="${p?p.price:0}"/></div>
      <div class="field"><label>Ειδοποίηση όταν πέσει κάτω από</label><input id="f_low" type="number" value="${p?(p.lowStockAt??5):5}"/></div>
      <div class="modalbtns">
        ${p?'<button class="iconbtn danger" id="btnDelete">Διαγραφή</button>':''}
        <button class="iconbtn ghost" id="btnCancel">Άκυρο</button>
        <button class="iconbtn signal" id="btnSave">Αποθήκευση</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  document.getElementById('btnCancel').addEventListener('click', closeModal);
  wrap.addEventListener('click', e=>{ if(e.target===wrap) closeModal(); });

  const catInput = document.getElementById('f_cat');
  const catSuggest = document.getElementById('catSuggest');
  const allCats = categories().filter(c=>c!=='Όλα');
  function showCatSuggestions(){
    const term = catInput.value.trim().toLowerCase();
    const matches = allCats.filter(c=>!term || c.toLowerCase().includes(term));
    if(matches.length===0){ catSuggest.style.display='none'; return; }
    catSuggest.innerHTML = matches.map(c=>`<div class="catopt">${esc(c)}</div>`).join('');
    catSuggest.style.display='block';
    catSuggest.querySelectorAll('.catopt').forEach((el,i)=>{
      el.addEventListener('mousedown', e=>e.preventDefault()); // keep focus, avoid blur firing first
      el.addEventListener('click', ()=>{
        catInput.value = matches[i];
        catSuggest.style.display='none';
      });
    });
  }
  catInput.addEventListener('focus', showCatSuggestions);
  catInput.addEventListener('input', showCatSuggestions);
  catInput.addEventListener('blur', ()=>{ setTimeout(()=>{ catSuggest.style.display='none'; }, 150); });

  if(p){
    document.getElementById('btnDelete').addEventListener('click', async ()=>{
      const btn = document.getElementById('btnDelete');
      btn.disabled = true; btn.textContent = 'Διαγραφή...';
      const ok = await persistDelete(id);
      if(ok){
        closeModal(); render();
        showToast('Το προϊόν διαγράφηκε.');
      } else {
        btn.disabled = false; btn.textContent = 'Διαγραφή';
        showToast('⚠ Δεν διαγράφηκε — δοκίμασε ξανά.');
      }
    });
  }
  document.getElementById('btnSave').addEventListener('click', async ()=>{
    const name = document.getElementById('f_name').value.trim();
    if(!name){ showToast('Βάλε ένα όνομα προϊόντος.'); return; }
    const data = {
      id: p ? p.id : uid(),
      code: document.getElementById('f_code').value.trim() || 'ΧΩΡΙΣ-ΚΩΔΙΚΟ',
      name,
      category: document.getElementById('f_cat').value.trim() || 'Χωρίς κατηγορία',
      qty: parseFloat(document.getElementById('f_qty').value) || 0,
      price: parseFloat(document.getElementById('f_price').value) || 0,
      lowStockAt: parseFloat(document.getElementById('f_low').value) || 5,
    };
    const btn = document.getElementById('btnSave');
    btn.disabled = true; btn.textContent = 'Αποθήκευση...';
    const ok = await persistUpsert(data, !!p, p ? p.id : null);
    if(ok){
      closeModal(); render();
      showToast('Αποθηκεύτηκε.');
    } else {
      btn.disabled = false; btn.textContent = 'Αποθήκευση';
      showToast('⚠ Δεν αποθηκεύτηκε — δοκίμασε ξανά.');
      // leave the modal open with the user's input intact so they can retry
    }
  });
}

function openQrModal(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  const wrap = document.createElement('div');
  wrap.className='overlay';
  wrap.innerHTML = `
    <div class="modal">
      <h2>QR ετικέτα</h2>
      <div class="qrwrap">
        <div id="qrcanvas-holder"></div>
        <div class="qrmeta">${esc(p.code)} — ${esc(p.name)}</div>
      </div>
      <div class="modalbtns">
        <button class="iconbtn ghost" id="btnClose">Κλείσιμο</button>
        <button class="iconbtn signal" id="btnPrint">Εκτύπωση</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  new QRCode(document.getElementById('qrcanvas-holder'), {
    text: 'WH:'+p.id, width:180, height:180
  });
  document.getElementById('btnClose').addEventListener('click', closeModal);
  wrap.addEventListener('click', e=>{ if(e.target===wrap) closeModal(); });
  document.getElementById('btnPrint').addEventListener('click', ()=>{
    const holder = document.getElementById('qrcanvas-holder').innerHTML;
    const win = window.open('', '_blank');
    win.document.write(`<html><body style="text-align:center;font-family:sans-serif;padding:20px">
      ${holder}<div style="margin-top:8px;font-size:14px">${esc(p.code)} — ${esc(p.name)}</div>
      <script>window.print()<\/script></body></html>`);
  });
}

let codeReader = null;

async function openScanModal(){
  const wrap = document.createElement('div');
  wrap.className='overlay';
  wrap.innerHTML = `
    <div class="modal">
      <h2>Σάρωση QR / Barcode</h2>
      <video id="scanvideo" autoplay playsinline muted></video>
      <div class="scanhint">Δείξε την κάμερα στο QR ή στο barcode του προϊόντος.</div>
      <div id="scanresultholder"></div>
      <div class="modalbtns"><button class="iconbtn ghost" id="btnCloseScan">Κλείσιμο</button></div>
    </div>
  `;
  document.body.appendChild(wrap);
  document.getElementById('btnCloseScan').addEventListener('click', closeModal);
  wrap.addEventListener('click', e=>{ if(e.target===wrap) closeModal(); });

  const video = document.getElementById('scanvideo');

  if(typeof ZXing === 'undefined'){
    document.getElementById('scanresultholder').innerHTML =
      `<div class="scanresult">Η βιβλιοθήκη σάρωσης δεν φορτώθηκε (πρόβλημα σύνδεσης). Δοκίμασε ξανά.</div>`;
    return;
  }

  codeReader = new ZXing.BrowserMultiFormatReader();

  try{
    const devices = await codeReader.listVideoInputDevices();
    if(!devices || devices.length===0){
      throw Object.assign(new Error('no camera'), { name: 'NotFoundError' });
    }
    const backCam = devices.find(d => /back|rear|environment/i.test(d.label)) || devices[devices.length-1];
    const deviceId = backCam ? backCam.deviceId : undefined;

    codeReader.decodeFromVideoDevice(deviceId, video, (result, err) => {
      if(result){
        handleScanResult(result.getText());
      }
    });
  }catch(e){
    const name = e && e.name ? e.name : 'ΑγνωστοΣφάλμα';
    let msg = 'Δεν υπήρξε πρόσβαση στην κάμερα (' + name + ').';
    if(name === 'NotAllowedError'){
      msg += ' Το δικαίωμα κάμερας έχει απορριφθεί για αυτή τη σελίδα — έλεγξε τις ρυθμίσεις δικαιωμάτων του browser για κάμερα.';
    } else if(name === 'NotFoundError'){
      msg += ' Δεν βρέθηκε κάμερα στη συσκευή.';
    } else if(name === 'NotReadableError'){
      msg += ' Η κάμερα μπορεί να χρησιμοποιείται ήδη από άλλη εφαρμογή.';
    } else if(name === 'SecurityError' || !navigator.mediaDevices){
      msg += ' Ο browser μπλοκάρει την κάμερα σε αυτή τη σελίδα (περιορισμός ασφαλείας).';
    }
    document.getElementById('scanresultholder').innerHTML =
      `<div class="scanresult">${esc(msg)}</div>`;
  }
}

function handleScanResult(text){
  let p = null;
  if(text.startsWith('WH:')){
    const id = text.slice(3);
    p = products.find(x=>x.id===id);
  }
  if(!p){
    p = products.find(x=>(x.code||'').trim().toLowerCase() === text.trim().toLowerCase());
  }

  if(codeReader){ try{ codeReader.reset(); }catch(e){} codeReader=null; }
  const video = document.getElementById('scanvideo');
  if(video) video.style.display='none';

  const holder = document.getElementById('scanresultholder');
  if(p){
    holder.innerHTML = `
      <div class="scanresult">
        <div class="code">${esc(p.code)}</div>
        <div class="name" style="margin-bottom:6px">${esc(p.name)}</div>
        <div class="row">
          <div class="qty">${p.qty}<span>Τεμάχια</span></div>
          <div class="price">${Number(p.price||0).toFixed(2)}€<span>Τιμή</span></div>
        </div>
      </div>`;
  } else {
    const scannedCode = text.startsWith('WH:') ? '' : text; // WH: codes are our own internal QR ids, not real barcodes
    holder.innerHTML = `
      <div class="scanresult">
        Δεν βρέθηκε προϊόν με κωδικό <b>${esc(text)}</b>.
        <div class="modalbtns" style="margin-top:10px">
          <button class="iconbtn signal" id="btnCreateFromScan" style="flex:1">+ Δημιουργία με αυτόν τον κωδικό</button>
        </div>
      </div>`;
    document.getElementById('btnCreateFromScan').addEventListener('click', ()=>{
      closeModal();
      openEditModal(null, scannedCode);
    });
  }
}

loadProducts();
</script>
